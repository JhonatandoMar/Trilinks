<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/login.css">
  <link rel="shortcut icon" href="../img/TLoZ_Series_Triforce_Artwork.webp" type="image/x-icon">
  <title>Trilinks</title>
</head>

<body>
  <!-- Estrutura do formulário -->
  <div class="login">
    <!-- Menu para a homepage e tela de cadastro -->
    <nav class="menu">
      <img src="../img/icons_zelda002-02.png" alt="">
      <a href="../../_theme.html">HOME</a>
      <img src="../img/icons_zelda002-07.png" alt="">
      <a href="registrer.html">CADASTRO</a>
    </nav>
    <!-- Fim do menu -->

    <!-- Estrutura do formulário -->
    <div class="card-login">
      <!-- Título e subtítulo do formulário -->
      <header class="title-login">
        <h2>LOG IN</h2>
        <p>Bem vindo ao Trilinks, porfavor insira suas informações de login para começar a usar o site</p>
      </header>
      <!-- Fim do título e subtítulo -->

      <!-- Formulário -->
      <form>
        <div class="textfield">
          <input type="email" name="email" placeholder="E-mail" required>
        </div>
        <div class="textfield">
          <input type="password" name="senha" placeholder="Senha" required>
        </div>
        
        <!-- Checkbox e botão de login -->
        <div class="checkfield">
          <div class="checkbox">
            <input type="checkbox" id="change-method">
            <label for="change-method">Manter Login</label>
          </div>
          <button type="submit">Log in</button>
        </div>
        <!-- Fim do checkbox e login -->
      </form>

      <p>Não tem uma conta? <a href="#">Cadastre-se!</a></p>
    </div>
    <!-- Fim do formulário -->
  </div>
  <!-- Fim da estrutura do formulario -->
  
  <!-- titulo e sub-titulo do lado -->
  <div class="title">
    <h1>TRILINKS</h1>
    <h2>...uma verdadeira obra de arte magica...</h2>
  </div>
  <!-- fim do titulo e sub-titulo ao lado -->
</body>

</html>
