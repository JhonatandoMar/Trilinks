<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela de Login</title>
  <link rel="stylesheet" href="../css/registrer.css">
  <link rel="shortcut icon" href="/Projeto_Teste_Zelda/themes/web/assets/img/Logo-Teste-Triforce-002.png" type="image/x-icon">
</head>

<body>

  <!-- Cabeçalho -->
  <header>
    <nav>
      <div class="func">

        <a href="../../_theme.html"> <img src="../img/icons_zelda002-02.png" alt="">Home</a>

        <a href="registrer.html"><img src="../img/icons_zelda002-07.png" alt="">Login</a>

      </div>
      <div>
        <img class="imagem" src="../img/Icone-Link-002.png" alt="Ícone do Link">
      </div>
    </nav>
  </header>
  <!-- Fim Cabeçalho -->

  <!-- Conteúdo Principal -->
  <main class="container">

    <section class="estrutura">
      <header class="titulo">
        <h1>TRILINKS</h1>
        <p>...UMA VERDADEIRA OBRA DE ARTE MAGICA...</p>
      </header>
    </section>

    <section>
      <header class="text">
        <h2>Criar Uma Nova <span>Conta</span></h2>
        <p>Já Possui <span>Login?</span></p>
      </header>

      <form>
        <div class="perguntas-1">

          <input type="text" placeholder="Primeiro Nome" name="primeiro_nome" required>

          <input type="text" placeholder="Segundo Nome" name="segundo_nome" required>

        </div>

        <div class="perguntas-2">

          <input type="tel" placeholder="Número De Celular" name="celular" required>

          <input type="email" placeholder="Email" name="email" required>

          <input type="password" placeholder="Senha" name="senha" required>

        </div>

        <div class="botons">

          <a href="#">Criar Conta</a>

        </div>
      </form>

    </section>

  </main>
  <!-- Fim Conteúdo Principal -->

</body>

</html>
